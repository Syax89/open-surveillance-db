# Install as /etc/systemd/system/osdb-test.service.d/d1-authoritative.conf.
# The encrypted credential is created on LXC 114 with systemd-creds; no API
# token is stored in .dev.vars, in this file, or in the Git repository.
[Service]
LoadCredentialEncrypted=cloudflare_api_token:/etc/credstore.encrypted/osdb-d1-api-token.cred
ExecStart=
ExecStart=/usr/local/libexec/osdb-test-d1-authoritative-start
