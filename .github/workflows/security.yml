name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # ogni lunedì 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Gitleaks (hardcoded secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Su PR: scansiona SOLO i commit della PR (base..head), non l'intero
            # storico git. Lo scan completo (fetch-depth: 0) include branch non
            # ancora mergeati con token di test → falsi positivi su ogni PR.
            # SHA passati via env (hex-only, mai input utente) — vedi
            # https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
            echo "Scan PR commits: ${PR_BASE_SHA}..${PR_HEAD_SHA}"
            gitleaks detect --source . --redact --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Su push a main: scansiona SOLO i commit introdotti dal push
            # (before..after), non l'intero storico. Lo scan completo include
            # branch WIP non ancora mergeati (es. token di test in fixture) →
            # falsi positivi su OGNI push a main, anche innocuo (regressione
            # 43db967 / 9d5d177: gate rosso per un token mai mergiato).
            if [ "${PUSH_BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              # Primo push assoluto (before non esiste): fallback allo scan
              # dello storico raggiungibile da main.
              echo "Push iniziale (before all-zero): scan storico raggiungibile da main"
              gitleaks detect --source . --redact --log-opts=main
            else
              echo "Scan push commits: ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
              gitleaks detect --source . --redact --log-opts="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
            fi
          else
            # Schedule (settimanale): sweep completo dello storico raggiungibile
            # da main. I branch WIP non mergiati restano fuori (i loro secret
            # emergono sulla PR via base..head), quindi il job non si rompe su
            # token di test presenti su branch in lavorazione.
            echo "Scan schedule: storico raggiungibile da main"
            gitleaks detect --source . --redact --log-opts=main
          fi

  dependency-audit:
    name: npm audit (vulnerable dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production dependencies — gate)
        # Gate bloccante sul runtime: tutto ciò che va in produzione.
        # Le vulnerabilità nelle devDependencies (tooling) NON bloccano qui,
        # ma vengono riportate dallo step completo qui sotto.
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (full report — non-blocking)
        # Report completo incluso le devDependencies (es. brace-expansion via
        # eslint-plugin-*, esbuild via drizzle-kit/wrangler: debito noto non
        # risolvibile senza major upgrade). continue-on-error mantiene il
        # check visibile senza bloccare il merge.
        continue-on-error: true
        run: npm audit --audit-level=high
