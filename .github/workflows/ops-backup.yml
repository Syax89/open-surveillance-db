name: Ops Backup D1

# Backup giornaliero del database D1 di produzione (docs/OPERATIONS.md §3).
# Il dump contiene dati sensibili (contatti delle richieste di correzione,
# coda di moderazione): viene CIFRATO prima di essere salvato come artifact
# GitHub privato del run. La passphrase vive SOLO in secrets.BACKUP_PASSPHRASE.
# Questo workflow non esegue mai deploy e non tocca il worker in produzione.
#
# Guard fail-fast: i secrets Cloudflare (CLOUDFLARE_API_TOKEN/ACCOUNT_ID) e il
# database_id reale (D1_DATABASE_ID, iniettato da secret GitHub come in
# deploy.yml) servono solo al backup del D1 remoto, che è operativo SOLO dopo
# il deploy pubblico (ADR 0012, DEPLOYMENT.md). Fino ad allora il run si ferma
# qui con errore chiaro: l'ambiente attivo è il test container self-hosted e
# il suo backup è gestito da ops/backup-lxc114.sh (OPERATIONS.md §8).
#
# Attivazione: `gh variable set ENABLE_CF_BACKUP true` (vedi OPERATIONS.md §3.2);
# il job notturno salta finché la variabile non è "true".

on:
  schedule:
    - cron: "0 2 * * *" # ogni giorno 02:00 UTC — backup D1 (gated su vars.ENABLE_CF_BACKUP, F10)
    - cron: "0 3 1 */3 *" # trimestrale 03:00 UTC — restore drill (gated su vars.ENABLE_RESTORE_DRILL + ENABLE_CF_BACKUP, F10)
  workflow_dispatch:
    inputs:
      mode:
        description: "backup = export+cifra+upload; drill = backup + restore drill su D1 temporaneo (scrive su D1: consuma quota righe)"
        type: choice
        options:
          - backup
          - drill
        default: backup

concurrency:
  group: ops-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export D1 + verify + encrypt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # F10 qa#5 (t_ab0d4c75): il run notturno NON deve più essere rosso per
    # design durante la fase LXC. Lo schedule salta il job (visibile come
    # "skipped", non rosso) finché vars.ENABLE_CF_BACKUP != "true"; il
    # workflow_dispatch manuale (drill) procede SEMPRE, anche con la var
    # spenta, per permettere il test del pipeline quando serve.
    if: ${{ github.event_name != 'schedule' || vars.ENABLE_CF_BACKUP == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare secrets (fail-fast)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Secrets GitHub mancanti: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID devono essere configurati (gh secret set). Il backup D1 remoto è operativo solo dopo il deploy Cloudflare (ADR 0012): finché l'ambiente attivo è il test container self-hosted, il backup è ops/backup-lxc114.sh (OPERATIONS.md §8)."
            exit 1
          fi
          echo "Secrets Cloudflare: OK"

      - name: Inject D1 database_id from GitHub secret (fail-fast, mai export su DB placeholder)
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "${D1_DATABASE_ID}" ]; then
            echo "::error::Secret GitHub D1_DATABASE_ID mancante. Prima di attivare il backup remoto (ENABLE_CF_BACKUP=true):"
            echo "  gh secret set D1_DATABASE_ID"
            exit 1
          fi
          sed -i "s/00000000-0000-4000-8000-000000000000/${D1_DATABASE_ID}/" wrangler.jsonc
          echo "database_id: iniettato dal secret GitHub (mai committato)"

      - name: Export D1 remoto (schema + dati)
        id: export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          stamp=$(date +%F)
          # Due file, non un dump unico: il dump singolo NON e' ripristinabile
          # su D1. Il suo ordine e' per-tabella (schema di A, dati di A, schema
          # di B, ...) e l'import remoto committa a batch: una tabella figlia
          # con FK verso una tabella creata piu' avanti fa fallire il restore
          # ("no such table: main.contributors", drill 34971483131) e il
          # PRAGMA defer_foreign_keys non copre i confini di batch.
          # Schema e dati separati si ripristinano in due passi (schema prima,
          # dati poi) — provato in locale.
          npx wrangler d1 export osdb-production --remote \
            --no-data --output="d1-backup-${stamp}.schema.sql"
          npx wrangler d1 export osdb-production --remote \
            --no-schema --output="d1-backup-${stamp}.data.sql"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          ls -la "d1-backup-${stamp}.schema.sql" "d1-backup-${stamp}.data.sql"

      - name: Verifica struttura (3 tabelle attese) + dati presenti
        run: |
          stamp="${{ steps.export.outputs.stamp }}"
          s="d1-backup-${stamp}.schema.sql"
          d="d1-backup-${stamp}.data.sql"
          # Il dump riproduce il testo di sqlite_master, che NON e' uniforme:
          # le tabelle create dalle migrazioni drizzle hanno i backtick
          # (CREATE TABLE `cameras` (), mentre correction_requests - ricreata
          # con uno statement IF NOT EXISTS e rinominata dalla 0015 - compare
          # come CREATE TABLE IF NOT EXISTS "correction_requests" (.
          # Il vecchio grep "CREATE TABLE cameras " non poteva matchare nulla
          # (job rosso dal 2026-08-01). Pattern tollerante a IF NOT EXISTS,
          # quoting e spazi, verificato contro il dump reale di produzione.
          for t in cameras correction_requests moderation_events; do
            if grep -qE "CREATE TABLE (IF NOT EXISTS )?[\"'\`]?${t}[\"'\`]?[[:space:]]*\(" "$s"; then
              echo "OK tabella ${t}"
            else
              echo "::error::tabella ${t} MANCANTE nello schema ${s}"
              exit 1
            fi
          done
          if grep -qE "^INSERT INTO [\"'\`]?cameras[\"'\`]? " "$d"; then
            echo "OK dati presenti (INSERT INTO cameras nel file dati)"
          else
            echo "::error::nessun INSERT INTO cameras in ${d}: il backup conterrebbe solo lo schema"
            exit 1
          fi

      - name: Baseline conteggi (per il drill di restore)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute osdb-production --remote \
            --command="SELECT 'cameras' t, COUNT(*) n FROM cameras UNION ALL SELECT 'correction_requests', COUNT(*) FROM correction_requests UNION ALL SELECT 'moderation_events', COUNT(*) FROM moderation_events;" \
            --json | tee d1-counts.json

      - name: Cifra i dump (AES-256, passphrase da secret)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          stamp="${{ steps.export.outputs.stamp }}"
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::secret BACKUP_PASSPHRASE non configurato: il dump NON verrà cifrato, abort."
            exit 1
          fi
          for f in "d1-backup-${stamp}.schema.sql" "d1-backup-${stamp}.data.sql"; do
            openssl enc -aes-256-cbc -salt -pbkdf2 \
              -pass "pass:${BACKUP_PASSPHRASE}" \
              -in "$f" -out "${f}.enc"
            sha256sum "${f}.enc" > "${f}.enc.sha256"
            rm -f "$f" # mai l'artifact in chiaro
          done
          ls -la d1-backup-*.enc*

      - name: Upload artifact privato del run (solo cifrato)
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ steps.export.outputs.stamp }}
          path: |
            d1-backup-*.enc
            d1-backup-*.enc.sha256
            d1-counts.json
          retention-days: 30

      - name: Copia off-site su R2 (F10 qa#5)
        # F10 (t_ab0d4c75): gli artifact GitHub (30 gg) sono l'UNICA location
        # del backup — se l'account/repo ha un problema i dump spariscono.
        # Copia cifrata sul bucket R2 esistente (opensurveillancedb-photos),
        # prefisso d1-backups/ che non collide mai con le chiavi foto (le
        # foto sono servite per key = photo id). Il bucket è privato: nessun
        # oggetto è esposto senza il worker + gate.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          stamp="${{ steps.export.outputs.stamp }}"
          # --remote OBBLIGATORIO su ogni comando r2: senza, wrangler v4
          # scrive nel simulatore LOCALE del runner e stampa comunque
          # "Upload complete" (falso verde: il backup non arrivava mai su R2).
          for f in "d1-backup-${stamp}.schema.sql" "d1-backup-${stamp}.data.sql"; do
            npx wrangler r2 object put "opensurveillancedb-photos/d1-backups/${f}.enc" --file="${f}.enc" --remote
            npx wrangler r2 object put "opensurveillancedb-photos/d1-backups/${f}.enc.sha256" --file="${f}.enc.sha256" --remote
          done
          # Verifica reale (non la dichiarazione di wrangler): rileggi da R2
          # l'oggetto piccolo e confrontalo con quello locale.
          chk="d1-backup-${stamp}.schema.sql.enc.sha256"
          npx wrangler r2 object get "opensurveillancedb-photos/d1-backups/${chk}" --file=/tmp/r2-check.sha256 --remote
          if cmp -s "${chk}" /tmp/r2-check.sha256; then
            echo "R2 verificato: opensurveillancedb-photos/d1-backups/${chk} identico alla copia locale"
          else
            echo "::error::copia off-site su R2 NON verificata (oggetto assente o diverso)"
            exit 1
          fi

  restore-drill:
    name: Restore drill (D1 temporaneo, F10 qa#5)
    # F10 (t_ab0d4c75): il restore non era MAI stato esercitato. Il drill
    # scarica l'ultimo backup cifrato, lo applica a un D1 temporaneo e fa
    # smoke sui conteggi. Manuale (workflow_dispatch, mode=drill) oppure solo
    # al cron trimestrale (03:00 del 1° del mese ogni 3), e solo se il backup
    # CF è attivo E il drill è abilitato (vars.ENABLE_RESTORE_DRILL == "true").
    # `needs: backup`: senza dipendenza il drill partiva in parallelo e non
    # trovava l'artifact del run ("Nessun artifact d1-backup-* disponibile").
    # Il gate su github.event.schedule evita il drill a OGNI run notturno.
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'drill') || (github.event.schedule == '0 3 1 */3 *' && vars.ENABLE_CF_BACKUP == 'true' && vars.ENABLE_RESTORE_DRILL == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check secrets (fail-fast)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Secrets Cloudflare mancanti per il restore drill."
            exit 1
          fi
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error::BACKUP_PASSPHRASE mancante: il dump cifrato non può essere decifrato."
            exit 1
          fi

      - name: Scarica l'ultimo backup cifrato (artifact più recente non scaduto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ART=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            -q '[.artifacts[] | select(.name | startswith("d1-backup-")) | select(.expired == false)] | sort_by(.created_at) | reverse | .[0]')
          if [ -z "$ART" ] || [ "$ART" = "null" ]; then
            echo "::error::Nessun artifact d1-backup-* disponibile: esegui prima il job backup."
            exit 1
          fi
          ART_ID=$(echo "$ART" | jq -r .id)
          ART_NAME=$(echo "$ART" | jq -r .name)
          echo "artifact: ${ART_NAME} (id ${ART_ID})"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > backup.zip
          unzip -o backup.zip
          ls -la d1-backup-*.enc

      - name: Decifra i dump (AES-256) + verifica sha256
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Due file: schema e dati, da ripristinare in quest'ordine.
          for enc in d1-backup-*.schema.sql.enc d1-backup-*.data.sql.enc; do
            sha256sum -c "${enc}.sha256"
          done
          openssl enc -d -aes-256-cbc -pbkdf2 -pass "pass:${BACKUP_PASSPHRASE}" \
            -in "$(ls d1-backup-*.schema.sql.enc)" -out restore.schema.sql
          openssl enc -d -aes-256-cbc -pbkdf2 -pass "pass:${BACKUP_PASSPHRASE}" \
            -in "$(ls d1-backup-*.data.sql.enc)" -out restore.data.sql
          echo "Decifrato: restore.schema.sql ($(wc -l < restore.schema.sql) righe), restore.data.sql ($(wc -l < restore.data.sql) righe)"

      - name: Crea D1 temporaneo + applica dump + smoke conteggi + cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          stamp=$(date +%s)
          db="osdb-restore-drill-${stamp}"
          # Cleanup SEMPRE, anche se lo step fallisce a metà: nel primo run del
          # drill (34969640324) un errore prima del delete ha lasciato un D1
          # temporaneo appeso.
          cleanup() { npx wrangler d1 delete "$db" --config=wrangler-drill.jsonc -y || echo "::warning::Cleanup D1 temporaneo fallito: ${db}"; }
          trap cleanup EXIT
          create_out=$(npx wrangler d1 create "$db" 2>&1)
          db_id=$(echo "$create_out" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$db_id" ]; then
            echo "::error::Creazione D1 temporaneo fallita: ${create_out}"
            exit 1
          fi
          echo "D1 temporaneo: ${db} (${db_id})"
          # Config MINIMA per il drill (il file committato resta intatto).
          # NON parsare wrangler.jsonc con JSON.parse: e' JSONC (commenti) e il
          # drill moriva con "Expected double-quoted property name" prima di
          # arrivare al restore.
          printf '{\n  "name": "osdb-restore-drill",\n  "compatibility_date": "2026-01-01",\n  "d1_databases": [\n    { "binding": "DB_DRILL", "database_name": "%s", "database_id": "%s" }\n  ]\n}\n' "$db" "$db_id" > wrangler-drill.jsonc
          node -e 'JSON.parse(require("fs").readFileSync("wrangler-drill.jsonc","utf8"))' || { echo "::error::wrangler-drill.jsonc non valido"; exit 1; }
          # Restore in DUE passi: prima tutto lo schema (così ogni tabella
          # esiste), poi i dati. Il dump unico falliva con "no such table:
          # main.contributors" perché l'ordine per-tabella mette i dati di una
          # figlia prima della creazione del padre.
          echo "--- Passo 1/2: schema"
          npx wrangler d1 execute "$db" --remote --config=wrangler-drill.jsonc --file=restore.schema.sql --yes
          echo "--- Passo 2/2: dati"
          npx wrangler d1 execute "$db" --remote --config=wrangler-drill.jsonc --file=restore.data.sql --yes
          echo "--- Smoke conteggi (D1 temporaneo) ---"
          npx wrangler d1 execute "$db" --remote --config=wrangler-drill.jsonc \
            --command="SELECT 'cameras' t, COUNT(*) n FROM cameras UNION ALL SELECT 'correction_requests', COUNT(*) FROM correction_requests UNION ALL SELECT 'moderation_events', COUNT(*) FROM moderation_events;" \
            --json | tee drill-counts.json
          echo "RESTORE DRILL OK: dump applicato e conteggi verificati su D1 temporaneo."
