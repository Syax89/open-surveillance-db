name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Test the same public metadata that the production deploy builds.
      NEXT_PUBLIC_SITE_URL: https://opensurveillancedb.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint 9)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Test (build + node --test suite)
        # Serialize node --test: the jsdom suites (client-account, client-edit-*)
        # OOM the 7GB runner when several run in parallel (default concurrency
        # = availableParallelism, 4 on ubuntu-latest) — SIGKILL on the largest
        # processes (api-keys epic T18, run 31380300635).
        run: npm run build && node --test --test-concurrency=1 "tests/*.test.mjs"

  coverage:
    name: Coverage (soglia righe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The coverage command builds before executing the rendered sitemap tests.
      NEXT_PUBLIC_SITE_URL: https://opensurveillancedb.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build + full suite con coverage, poi soglia minima sulle righe (solo
      # codice di produzione, esclusi test/helper/mock/fixture): sotto
      # COVERAGE_LINES (default 75) il job fallisce. Baseline in docs/QA_COVERAGE.md.
      #
      # NOTA OPERATIVA (t_c97844c2, run 30964829750 su main d31f53cc):
      # 1) Il riepilogo inline "all files ~48.18%" stampato da node --test NON è
      #    la metrica del gate: è un artefatto degli include su .coverage/trees/**
      #    (alberi transpilati) e appare identico anche nei run verdi. La soglia
      #    reale (~95% su main) è il report c8 prodotto da coverage:docs.
      # 2) npm run coverage usa set -euo pipefail: se UN test flaky fallisce,
      #    node --test esce 1 e il job muore PRIMA del passo soglia, con messaggio
      #    fuorviante. La causa del rosso del 2026-08-05 era il test
      #    client-field-of-view.test.mjs:378 (race change one-shot sullo slider
      #    controllato, 1/2051, probe 6/400), NON un calo di coverage. Fix nel
      #    test (retry del change in waitFor, stesso pattern di t_18d6f344).
      #    Se il job torna rosso: controllare PRIMA i test falliti nel log, non
      #    il totale inline — un re-run pulito NON copre regressioni reali.
      - name: Coverage run
        run: npm run coverage

      - name: Coverage threshold (righe)
        run: npm run coverage:docs
        env:
          COVERAGE_LINES: 75

  db-migration-smoke:
    name: Fresh-DB migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fresh-DB migration smoke test
        run: npm run db:smoke
