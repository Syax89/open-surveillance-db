name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint 9)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Test (build + node --test suite)
        run: npm test

  coverage:
    name: Coverage (soglia righe)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build + full suite con coverage, poi soglia minima sulle righe (solo
      # codice di produzione, esclusi test/helper/mock/fixture): sotto
      # COVERAGE_LINES (default 75) il job fallisce. Baseline in docs/QA_COVERAGE.md.
      - name: Coverage run
        run: npm run coverage

      - name: Coverage threshold (righe)
        run: npm run coverage:docs
        env:
          COVERAGE_LINES: 75

  db-migration-smoke:
    name: Fresh-DB migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fresh-DB migration smoke test
        run: npm run db:smoke
