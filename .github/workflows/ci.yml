name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    # Tests now run with coverage instrumentation (~19 min typical).
    timeout-minutes: 45
    env:
      # Test the same public metadata that the production deploy builds.
      NEXT_PUBLIC_SITE_URL: https://opensurveillancedb.org

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint 9)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      # One run instead of two (2026-11): the suite used to run twice per PR,
      # once here and once in a separate "Coverage" job that repeated npm ci,
      # the build and all ~3,000 tests (~13 + ~19 runner minutes). It now runs
      # ONCE, with V8 coverage, and the line threshold is checked right after,
      # so both gates (tests green + coverage >= COVERAGE_LINES) stay blocking.
      # `npm run coverage` builds first and serializes node --test
      # (--test-concurrency=1): the jsdom suites (client-account,
      # client-edit-*) OOM the 7GB runner when several run in parallel —
      # SIGKILL on the largest processes (api-keys epic T18, run 31380300635).
      # Build + full suite con coverage, poi soglia minima sulle righe (solo
      # codice di produzione, esclusi test/helper/mock/fixture): sotto
      # COVERAGE_LINES (default 75) il job fallisce. Baseline in docs/QA_COVERAGE.md.
      #
      # NOTA OPERATIVA (t_c97844c2, run 30964829750 su main d31f53cc):
      # 1) Il riepilogo inline "all files ~48.18%" stampato da node --test NON è
      #    la metrica del gate: è un artefatto degli include su .coverage/trees/**
      #    (alberi transpilati) e appare identico anche nei run verdi. La soglia
      #    reale (~95% su main) è il report c8 prodotto da coverage:docs.
      # 2) npm run coverage usa set -euo pipefail: se UN test flaky fallisce,
      #    node --test esce 1 e il job muore PRIMA del passo soglia, con messaggio
      #    fuorviante. La causa del rosso del 2026-08-05 era il test
      #    client-field-of-view.test.mjs:378 (race change one-shot sullo slider
      #    controllato, 1/2051, probe 6/400), NON un calo di coverage. Fix nel
      #    test (retry del change in waitFor, stesso pattern di t_18d6f344).
      #    Se il job torna rosso: controllare PRIMA i test falliti nel log, non
      #    il totale inline — un re-run pulito NON copre regressioni reali.
      - name: Build + test suite (with coverage)
        run: npm run coverage

      - name: Coverage threshold (righe)
        run: npm run coverage:docs
        env:
          COVERAGE_LINES: 75

  db-migration-smoke:
    name: Fresh-DB migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fresh-DB migration smoke test
        run: npm run db:smoke
