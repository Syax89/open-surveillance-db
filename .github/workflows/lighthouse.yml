name: Lighthouse a11y gate

# BLOCKING accessibility gate (QA proposal F-QA item 6, kanban t_2d2bf33f).
# Runs Lighthouse (real Chromium) against a preview build of the public
# routes and FAILS the check run when the accessibility category score drops
# below 0.95 — a PR cannot merge with a red lighthouse job.
#
# Reliability fix (kanban t_2f6e49a0, 2026-08-02): the URL list in
# lighthouserc.cjs is now ONE representative route per distinct layout
# template (~10 instead of 19) — runtime dropped from 16-22 min to ~8-10 min,
# ending the 20-min-timeout race and the runner-pool saturation that left
# runs "in_progress" for 40+ min. The Lighthouse CI step also has its own
# fail-fast timeout (15 min): a genuinely hung Lighthouse (server/Chrome)
# dies with a visible error instead of sitting in_progress until a human
# cancels it. Job-level timeout raised to 30 min as a safety net.
#
# Covers the layout-dependent axe rules that the jsdom-based SSR suite cannot
# evaluate (color-contrast, target-size WCAG 2.5.8, link-in-text-block,
# scrollable-region-focusable) — see lighthouserc.cjs and
# docs/ACCESSIBILITY_STATEMENT.md.
#
# Local equivalent for QA: `npm run build && npx lhci autorun`

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-a11y:
    name: Lighthouse accessibility >= 0.95
    runs-on: ubuntu-latest
    # 30 min: ~8-10 min typical after the URL trim (t_2f6e49a0) + queue slack.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle (dist/)
        run: npm run build

      - name: Lighthouse CI (collect + assert + upload)
        # Fail-fast: a hung Lighthouse (server/Chrome) dies here with a
        # visible error instead of leaving the check "in_progress" forever
        # (t_2f6e49a0). 15 min ≈ 1.5x the expected ~10 min — no false alarms.
        timeout-minutes: 15
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          # Report on temporary public storage (results are also kept as a
          # workflow artifact for the PR). No secrets involved.
          temporaryPublicStorage: true
