name: Deploy Cloudflare

# Deploy del Worker + migrazioni D1 di produzione (docs/OPERATIONS.md §7).
#
# Trigger: SOLO manuale (workflow_dispatch) finché non è presa la decisione
# sul deploy pubblico (DEPLOYMENT.md "Preconditions for a public
# environment"). Quando la precondizione è decisa, sbloccare il trigger
# automatico su tag v* aggiungendo:
#
#   push:
#     tags: ["v*"]
#
# (decisione tag-only vs push su main: da confermare con il maintainer).
#
# Modalità:
#   dry-run (default) — verifica migrazioni pendenti e bundle del worker
#                       SENZA toccare l'ambiente remoto.
#   deploy            — applica le migrazioni D1 remote e carica il worker.
#
# Sicurezza:
#   - Nessun segreto nel file: le credenziali Cloudflare arrivano dai
#     secrets GitHub, quelle di moderazione sono secrets del worker CF
#     (`wrangler secret put`), mai hardcoded.
#   - Fail-fast: se il secret `D1_DATABASE_ID` (o i secrets CF) manca, il
#     job termina subito con errore chiaro. Il database_id reale non è mai
#     nel repo: wrangler.jsonc tiene il placeholder e il workflow lo
#     sostituisce al volo dal secret GitHub (template pulito).
#   - `environment: production` (GitHub Environments): aggiungere required
#     reviewers per il gate umano sul deploy.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) | deploy"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read
  # F9 qa#5 (t_ab0d4c75): l'upload dello snapshot D1 pre-migrazione e del
  # version-id precedente come artifact del run richiede actions: write.
  actions: write

jobs:
  deploy:
    name: Deploy Worker + D1 (production)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare secrets (fail-fast)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Secrets GitHub mancanti: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID devono essere configurati (gh secret set)."
            exit 1
          fi
          echo "Secrets Cloudflare: OK"

      - name: Inject D1 database_id from GitHub secret (fail-fast, mai deploy su DB placeholder)
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "${D1_DATABASE_ID}" ]; then
            echo "::error::Secret GitHub D1_DATABASE_ID mancante. Il template tiene il placeholder in wrangler.jsonc; prima del primo deploy:"
            echo "  npx wrangler d1 create osdb-production   # output: database_id"
            echo "  gh secret set D1_DATABASE_ID"
            exit 1
          fi
          sed -i "s/00000000-0000-4000-8000-000000000000/${D1_DATABASE_ID}/" wrangler.jsonc
          echo "database_id: iniettato dal secret GitHub (mai committato)"

      - name: Build (dist/client per ASSETS + bundle server)
        run: npm run build

      - name: Dry run D1 migrations (read-only, nessuna modifica remota)
        if: ${{ github.event.inputs.mode == 'dry-run' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `wrangler d1 migrations apply --remote --dry-run` NON esiste (wrangler 4.x:
          # "Unknown arguments: dry-run, dryRun", exit 1). `migrations list` è l'equivalente
          # read-only: elenca le migrazioni non applicate senza toccare il remoto.
          echo "Migrazioni pendenti (read-only, nessuna applicata):"
          npx wrangler d1 migrations list osdb-production --remote

      - name: Dry run deploy (bundle locale, nessun upload)
        if: ${{ github.event.inputs.mode == 'dry-run' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --dry-run --outdir=.wrangler/dry-run
          echo "Dry run completato: nessuna modifica remota."

      - name: Capture previous version id (rollback reference, F9 qa#5)
        if: ${{ github.event.inputs.mode == 'deploy' }}
        id: capture-version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # F9 (t_ab0d4c75): salva il version-id ATTUALMENTE deployato PRIMA di
          # migrazioni/deploy, così il rollback ha il target esatto senza
          # scavare nei log del run (OPERATIONS.md §5.1). Parsing difensivo:
          # prima --json, poi fallback sulla tabella testuale.
          npx wrangler versions list --json > versions.json 2>/dev/null || npx wrangler versions list > versions.txt 2>&1
          PREV_ID=$(node -e '
            const fs = require("fs");
            let id = "";
            try {
              const arr = JSON.parse(fs.readFileSync("versions.json", "utf8"));
              if (Array.isArray(arr) && arr.length && arr[0].id) id = String(arr[0].id);
            } catch {}
            if (!id) {
              const txt = fs.readFileSync("versions.txt", "utf8");
              const m = txt.match(/^([0-9a-f]{32})\s/m);
              if (m) id = m[1];
            }
            process.stdout.write(id);
          ')
          if [ -z "$PREV_ID" ]; then
            echo "::warning::Impossibile parsare il version-id precedente (wrangler versions list): il target di rollback andrà cercato a mano."
          else
            echo "previous_version_id=${PREV_ID}" >> "$GITHUB_OUTPUT"
            echo "$PREV_ID" > previous-version-id.txt
            echo "Version-id precedente: ${PREV_ID}"
          fi

      - name: Snapshot D1 pre-migrazione (F9 qa#5, cifrato se BACKUP_PASSPHRASE)
        if: ${{ github.event.inputs.mode == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # F9 (t_ab0d4c75): snapshot del D1 di produzione nello stesso run del
          # deploy, PRIMA delle migrazioni — una migrazione distruttiva ha
          # sempre il restore dello stesso run (il backup notturno 02:00
          # potrebbe essere vecchio di un giorno). Mai artifact in chiaro:
          # cifrato se BACKUP_PASSPHRASE è configurato, altrimenti il file
          # resta solo sul runner effimero (non caricato).
          sha=$(git rev-parse --short HEAD)
          stamp=$(date +%Y%m%d-%H%M%S)
          f="pre-deploy-${sha}-${stamp}.sql"
          npx wrangler d1 export osdb-production --remote --output="$f"
          ls -la "$f"
          if [ -n "${BACKUP_PASSPHRASE:-}" ]; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -pass "pass:${BACKUP_PASSPHRASE}" -in "$f" -out "${f}.enc"
            sha256sum "${f}.enc" > "${f}.enc.sha256"
            rm -f "$f"
            echo "snapshot_enc=${f}.enc" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BACKUP_PASSPHRASE non configurato: snapshot lasciato NON cifrato sul runner (non verrà caricato come artifact)."
            echo "snapshot_enc=" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations (remoto, produzione)
        if: ${{ github.event.inputs.mode == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply osdb-production --remote

      - name: Deploy Worker + static assets
        if: ${{ github.event.inputs.mode == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          echo "Registrazione version id (correlazione rollback, OPERATIONS.md §5.1):"
          npx wrangler versions list | head -8
          # F9 (t_ab0d4c75): comando di rollback esatto nel job summary, con
          # il version-id precedente catturato prima del deploy.
          PREV_ID="${{ steps.capture-version.outputs.previous_version_id }}"
          {
            echo "## Rollback"
            if [ -n "$PREV_ID" ]; then
              echo "Target: version-id precedente \`${PREV_ID}\` (catturato prima del deploy)."
              echo '```bash'
              echo "npx wrangler rollback ${PREV_ID}"
              echo '```'
            else
              echo "Version-id precedente NON catturato: cercare l'ultimo deploy in \`wrangler versions list\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot D1 + version-id (artifact run, F9 qa#5)
        if: ${{ github.event.inputs.mode == 'deploy' }}
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-${{ github.sha }}
          path: |
            pre-deploy-*.enc
            pre-deploy-*.enc.sha256
            previous-version-id.txt
          if-no-files-found: warn
          retention-days: 30
